[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arc-utils"
version = "0.1.0"
description = "Reusable utilities for working with ARC-AGI data in this thesis workspace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Aleja" }
]
dependencies = [
  "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arc_utils"]

# The task corpus lives at the repository level during development. Include it
# inside the installed package so task loading also works from a wheel.
[tool.hatch.build.targets.wheel.force-include]
"data" = "arc_utils/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
